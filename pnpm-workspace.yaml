packages:
  - .
  - ../forms
  - ../goo
  - ../security
  - ../../goo
  - ../../security

blockExoticSubdeps: true
engineStrict: true
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  msw: true

overrides:
  svelte: 5.57.0
  devalue: 5.9.2
  joi: 17.13.6
  '@sveltejs/kit': 2.70.3
  brace-expansion: 5.0.9
  cookie: 0.7.2
  dompurify: 3.4.14
  nanoid: 3.3.18
  postcss: 8.5.26
  vite: 8.2.2
